name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (pytest)
        run: python -m pytest -q

      - name: Environment self-check
        if: matrix.python == '3.12'
        run: python scripts/apd.py doctor

      - name: End-to-end build + QA
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python scripts/apd.py build examples/demo/content_model.json -o build/demo.docx
          python scripts/apd.py qa build/demo.docx
          python scripts/apd.py build examples/minimal/content.json -o build/minimal.docx
          python scripts/apd.py qa build/minimal.docx

      - name: Python API example
        if: matrix.python == '3.12'
        run: python examples/python_api.py

      - name: Upload generated docs
        if: matrix.python == '3.12' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: generated-docx
          path: build/*.docx
          if-no-files-found: error
